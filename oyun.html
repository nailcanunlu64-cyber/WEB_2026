<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Bulmaca Oyunu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #4caf50; margin-bottom: 20px; }
        .game-container {
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .clue-box {
            background-color: #3a3a45;
            padding: 15px;
            border-radius: 5px;
            font-size: 18px;
            margin-bottom: 20px;
            border-left: 5px solid #4caf50;
        }
        .word-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .letter-box {
            width: 40px;
            height: 40px;
            border: 2px solid #555;
            background-color: #1e1e24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
        }
        .letter-box.revealed {
            border-color: #4caf50;
            color: #4caf50;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 60%;
            border-radius: 5px;
            border: 2px solid #555;
            background-color: #1e1e24;
            color: white;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        input[type="text"]:focus {
            border-color: #4caf50;
            outline: none;
        }
        button {
            background-color: #333;
            color: white;
            border: 2px solid #4caf50;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            margin: 5px;
        }
        button:hover {
            background-color: #4caf50;
            color: black;
            font-weight: bold;
        }
        .score-info {
            margin-top: 20px;
            font-size: 16px;
            color: #ffeb3b;
            display: flex;
            justify-content: space-around;
        }
        .message {
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
            min-height: 27px;
        }
    </style>
</head>
<body>

    <h1>🧩 Kelime Bulmaca Oyunu</h1>

    <div class="game-container">
        <div class="clue-box">
            <strong>İpucu:</strong> <span id="clueText">Yükleniyor...</span>
        </div>

        <div class="word-display" id="wordDisplay"></div>

        <input type="text" id="guessInput" placeholder="Tahmininizi yazın" maxlength="20">
        <br>
        <button onclick="checkGuess()">Tahmin Et</button>
        <button onclick="takeHint()">Harf Al (-10 Puan)</button>
        <button onclick="nextWord()">Pas Geç</button>

        <div id="messageText" class="message"></div>

        <div class="score-info">
            <div>Skor: <span id="scoreValue">0</span></div>
            <div>Kalan Hak: <span id="attemptsValue">3</span></div>
        </div>
    </div>

    <script>
        // Bulmaca Kelime Havuzu
        const wordPool = [
            { word: "BİLGİSAYAR", clue: "Verileri işleyen, saklayan elektronik cihaz." },
            { word: "TARAYICI", clue: "Web sitelerine girmek için kullandığınız program (Chrome, Edge vb.)." },
            { word: "İNTERNET", clue: "Dünya genelindeki bilgisayar ağlarını bağlayan sistem." },
            { word: "YAZILIM", clue: "Bilgisayarda çalışan programların genel adı." },
            { word: "KLAVYE", clue: "Üzerinde harfler ve sayılar bulunan veri giriş aracı." },
            { word: "BULMACA", clue: "Düşünerek veya ipuçlarından yararlanarak çözülen oyun." },
            { word: "KODLAMA", clue: "Bilgisayara yönergeler yazma işlemi, programlama." }
        ];

        let currentItem;
        let score = 0;
        let attempts = 3;
        let revealedLetters = [];

        function initGame() {
            if (wordPool.length === 0) {
                document.querySelector('.game-container').innerHTML = `<h2>🎉 Tebrikler! Tüm bulmacaları tamamladınız. Toplam Skor: ${score}</h2>`;
                return;
            }
            
            // Rastgele kelime seç ve havuzdan çıkar
            const randomIndex = Math.floor(Math.random() * wordPool.length);
            currentItem = wordPool[randomIndex];
            wordPool.splice(randomIndex, 1);

            attempts = 3;
            revealedLetters = new Array(currentItem.word.length).fill(false);

            document.getElementById('clueText').innerText = currentItem.clue;
            document.getElementById('attemptsValue').innerText = attempts;
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('messageText').innerText = "";
            document.getElementById('guessInput').value = "";

            renderWord();
        }

        function renderWord() {
            const display = document.getElementById('wordDisplay');
            display.innerHTML = '';
            
            for (let i = 0; i < currentItem.word.length; i++) {
                const box = document.createElement('div');
                box.classList.add('letter-box');
                
                if (revealedLetters[i]) {
                    box.innerText = currentItem.word[i];
                    box.classList.add('revealed');
                } else {
                    box.innerText = '_';
                }
                display.appendChild(box);
            }
        }

        function checkGuess() {
            const input = document.getElementById('guessInput').value.trim().toUpperCase().replace(/I/g, 'İ');
            const msg = document.getElementById('messageText');

            if (!input) return;

            if (input === currentItem.word) {
                msg.style.color = "#4caf50";
                msg.innerText = "🎉 Doğru Bildiniz! +50 Puan";
                score += 50;
                document.getElementById('scoreValue').innerText = score;
                setTimeout(initGame, 2000);
            } else {
                attempts--;
                document.getElementById('attemptsValue').innerText = attempts;
                msg.style.color = "#f44336";
                
                if (attempts <= 0) {
                    msg.innerText = `😢 Yanlış! Doğru cevap: ${currentItem.word}`;
                    score = Math.max(0, score - 20);
                    setTimeout(initGame, 3000);
                } else {
                    msg.innerText = `❌ Yanlış Tahmin! Kalan hak: ${attempts}`;
                }
            }
        }

        function takeHint() {
            const unrevealedIndices = [];
            for (let i = 0; i < revealedLetters.length; i++) {
                if (!revealedLetters[i]) unrevealedIndices.push(i);
            }

            if (unrevealedIndices.length > 1) {
                const randIndex = unrevealedIndices[Math.floor(Math.random() * unrevealedIndices.length)];
                revealedLetters[randIndex] = true;
                score = Math.max(0, score - 10);
                document.getElementById('scoreValue').innerText = score;
                renderWord();
            } else {
                document.getElementById('messageText').style.color = "#ffeb3b";
                document.getElementById('messageText').innerText = "⚠️ Son harf için tahmin yapmalısınız!";
            }
        }

        function nextWord() {
            score = Math.max(0, score - 15);
            initGame();
        }

        // Giriş alanında Enter tuşuna basıldığında kontrol etme
        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkGuess();
        });

        // Oyunu ilk kez başlat
        initGame();
    </script>
</body>
</html>
