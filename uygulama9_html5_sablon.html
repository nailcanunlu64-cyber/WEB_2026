<!DOCTYPE html>
<html>
    <head>
        <title>
            DIV ile HTML Web Sayfası Şablonu
        </title>
        <style>
        #header {
            width: 900px;
            border: 1px dotted darkblue;
            height: 60px;
            background-color: orange;
            text-align: center;
            line-height: 60px;
        }
        #nav{
            width: 200px;
            border: 1px dotted darkblue;
            height: 200px;
            background-color: purple;
            text-align: center;
            float: left;
        }
        #section{
            width: 500px;
            border: 1px dotted darkblue;
            height: 200px;
            background-color: rgb(85, 50, 85);
            text-align: center;
            float: left;
        }
        #aside{
            width: 200px;
            border: 1px dotted rgb(139, 0, 0);
            height: 200px;
            background-color: rgb(238, 8, 8);
            text-align: center;
            float: left;
        }
        #footer{
            width: 900px;
            border: 1px dotted rgb(139, 0, 12);
            height: 40px;
            background-color: gray;
            text-align: center;
            clear: left;

        }
            #sheader{
                width:90%;
                border:1px dotted rgb(12, 139, 0);
                height:40px;
                background-color:rgb(0, 255, 234);
                text-align: center;
                line-height: 40px;  
                margin:auto auto;
            }
            #article{
                width:90%;
                border:1px dotted rgb(12, 139, 0);
                height:40px;
                background-color:rgb(71, 255, 154);
                text-align: center;
                line-height: 40px;  
                margin:20px auto;
            }
            #sfooter{
                width:90%;
                border:1px dotted rgb(12, 139, 0);
                height:40px;
                background-color:rgb(0, 155, 147);
                text-align: center;
                line-height: 40px;  
                margin:auto auto;
            }
        </style>
    </head>
    <body>
        <div id="header">HEADER</div>
        <div id="nav">NAV</div>
        <div id="section">SECTION
            <div id="sheader">SHEADER</div>
            <div id="article">ARTICLE</div>
            <div id="sfooter">SFOOTER</div>
        </div>
        <div id="aside">ASIDE</div>
        <div id="footer">FOOTER</div>
    </body>
</html>
